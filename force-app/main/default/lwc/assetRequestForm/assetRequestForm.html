<template>
    <lightning-modal-header label="New Asset Request"></lightning-modal-header>

    <lightning-modal-body>
        <div class="slds-form" role="list">
            <div class="slds-form__row">
                <div class="slds-form__item" role="listitem">
                    <div class="slds-form-element slds-form-element_stacked">
                        <lightning-input name="employeeName" label="Employee Name" value={employeeName} onchange={handleChange}></lightning-input>
                    </div>
                </div>
                <div class="slds-form__item" role="listitem">
                    <div class="slds-form-element slds-form-element_stacked">
                        <lightning-input name="dateRequired" label="Required By Date" type="date" value={dateRequired} onchange={handleChange}></lightning-input>
                    </div>
                </div>
            </div>

            <div class="slds-form__row">
                <div class="slds-form__item" role="listitem">
                    <div class="slds-form-element slds-form-element_stacked">
                        <lightning-input name="employeeEmail" label="Employee Email" value={employeeEmail} onchange={handleChange}></lightning-input>
                    </div>
                </div>
                <div class="slds-form__item" role="listitem">
                    <div class="slds-form-element slds-form-element_stacked">
                        <lightning-input name="quantity" label="Quantity" value={quantity} onchange={handleChange}></lightning-input>
                    </div>
                </div>
            </div>

            <div class="slds-form__row">
                <div class="slds-form__item" role="listitem">
                    <div class="slds-form-element slds-form-element_stacked">
                        <lightning-combobox name="department" label="Department" value={department} options={departmentOptions} onchange={handleChange}></lightning-combobox>
                    </div>
                </div>
                <div class="slds-form__item" role="listitem">
                    <div class="slds-form-element slds-form-element_stacked">
                        <lightning-textarea name="justification" label="Business Justification" value={justification} onchange={handleChange}></lightning-textarea>
                    </div>
                </div>
            </div>

            <div class="slds-form__row">
                <div class="slds-form__item" role="listitem">
                    <div class="slds-form-element slds-form-element_stacked">
                        <lightning-combobox name="assetType" label="Asset Type" value={assetType} options={assetTypeOptions} onchange={handleChange}></lightning-combobox>
                    </div>
                </div>
                <div class="slds-form__item" role="listitem">
                    <div class="slds-form-element slds-form-element_stacked">
                        <lightning-input name="dateRequested" label="Requested Date" type="date" value={dateRequested} onchange={handleChange}></lightning-input>
                    </div>
                </div>
            </div>

            <div class="slds-form__row">
                <div class="slds-form__item" role="listitem">
                    <div class="slds-form-element slds-form-element_stacked">
                        <lightning-combobox name="priority" label="Priority" value={priority} options={priorityOptions} onchange={handleChange}></lightning-combobox>
                    </div>
                </div>
            </div>

            <div class="slds-form__row slds-text-align_right slds-p-around_large">
                <lightning-button variant="neutral" label="Cancel" onclick={handleCancel}></lightning-button>
                <lightning-button class="slds-m-left_small" variant="brand" label="Save as Draft" onclick={handleSave}></lightning-button>
            </div>
        </div>
    </lightning-modal-body>
</template>
