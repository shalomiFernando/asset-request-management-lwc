<template>
    <lightning-card title="Filters">
        <div class="slds-grid slds-wrap slds-p-around_medium slds-gutters">
            <div class="slds-col slds-size_1-of-5">
                <lightning-input name="employeeName" label="Employee Name" type="text" value={employeeName} onchange={handleChange}></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-5">
                <lightning-combobox name="department" label="Department" value={department} options={departmentOptions} onchange={handleChange}></lightning-combobox>
            </div>
            <div class="slds-col slds-size_1-of-5">
                <lightning-combobox name="assetType" label="Asset Type" value={assetType} options={assetTypeOptions} onchange={handleChange}></lightning-combobox>
            </div>
            <div class="slds-col slds-size_1-of-5">
                <lightning-combobox name="status" label="Status" value={status} options={statusOptions} onchange={handleChange}></lightning-combobox>
            </div>
            <div class="slds-col slds-size_1-of-5">
                <lightning-combobox name="priority" label="Priority" value={priority} options={priorityOptions} onchange={handleChange}></lightning-combobox>
            </div>
            <div class="slds-col slds-size_1-of-5">
                <lightning-input name="dateFrom" label="Requested Date From" type="date" value={dateFrom} onchange={handleChange}></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-5">
                <lightning-input name="dateTo" label="Requested Date To" type="date" value={dateTo} onchange={handleChange}></lightning-input>
            </div>
            <div class="slds-col slds-size_3-of-5 slds-text-align_right slds-p-around_large">
                <lightning-button variant="brand" label="Search" onclick={handleSearch}></lightning-button>
                <lightning-button class="slds-m-left_small" variant="neutral" label="Clear" onclick={handleClear}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
