<template>
    <lightning-card title="Asset Requests">
        <div style="height: 300px;">
            <lightning-datatable
                key-field="Id"
                data={requests}
                columns={columns}
                hide-checkbox-column="true"
                draft-values={draftValues}
                onsave={handleSave}
                oncellchange={handleCellChange}
                onrowaction={handleRowAction}
                onrowselection={handleRowSelection}>
            </lightning-datatable>
        </div>
    </lightning-card>
</template>
